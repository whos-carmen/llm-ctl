# llm-ctl-mon scrape config (CT 202). Prometheus here scrapes:
#   - llama.cpp metrics through the ops-tier nginx reverse proxy (192.168.7.50);
#     keeps the workstation :8082 firewall rule (only .50) untouched.
#   - node_exporter on 202 itself (127.0.0.1:9100).
#   - PVE guest metrics via prometheus-pve-exporter (127.0.0.1:9221).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: llama
    static_configs:
      - targets: ["192.168.7.50"]
    metrics_path: /metrics

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: pve
    honor_labels: true
    static_configs:
      - targets: ["192.168.4.111"]
    metrics_path: /pve
    params:
      target: ["https://192.168.4.111:8006/api2/json"]
    relabel_configs:
      - source_labels: ["__address__"]
        target_label: "__param_target"
      - source_labels: ["__param_target"]
        target_label: "target"
      - target_label: "__address__"
        replacement: "127.0.0.1:9221"