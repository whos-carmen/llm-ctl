# llm-ctl-ops: public (LAN) face for the llm-ctl daemon on the LLM host.
# Fronts the web panel, /api/* and /v1/* -> 192.168.7.23:8082 (no TLS, LAN only).
# Deployed to: /etc/nginx/sites-available/llm-ctl-ops on CT 200 (192.168.7.50).
server {
    listen 80;
    listen [::]:80;
    server_name llm-ctl-ops;

    # allow larger chat bodies through (llm-ctl itself caps at 10MB)
    client_max_body_size 20m;

    # Security headers (defense-in-depth on top of the LAN-only/no-auth model).
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Restrict the llama /metrics scrape to the monitoring CT (202) only.
    location = /metrics {
        allow 192.168.7.52;
        deny all;
        proxy_pass http://192.168.7.23:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        proxy_pass http://192.168.7.23:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE / streaming /v1 responses must not be buffered
        proxy_buffering off;
        # long generations
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
