# pi-bar config - isotope theme (base16-isotope, Plasma/Konsole port)
# NOTE: this strict TOML parser requires status states to have name+bg, rejects
# literal [ ] inside strings, and does NOT strip trailing # comments on value
# lines. Comments live on their own lines only.

[colors]
text_fg = "#d0d0d0"
dark = "#0a0a0a"
dir_bg = "#101010"
model_bg = "#1a1a1a"
thinking_bg = "#1a1a1a"
git_bg = "#101010"
activity_bg = "#1a1a1a"
activity_fg = "#00ffff"
ok = "#33ff00"
warn = "#ff0099"
alert = "#ff0000"
cyan = "#00ffff"

[statusbar.separators]
leading = ""
trailing = ""

[[statusbar.segments]]
type = "dir"
template = " {dir}"
fg = "text_fg"
bg = "dir_bg"

[[statusbar.segments]]
type = "value"
template = " {provider}:{model}"
empty_text = "no model"
fg = "cyan"
bg = "model_bg"

[[statusbar.segments]]
type = "value"
template = "{thinking}"
show_if = "model?.reasoning"
fg = "text_fg"
bg = "thinking_bg"

[[statusbar.segments]]
type = "meter"
value_eval = "ctx.getContextUsage()?.percent ?? 0"
template = "{percent}% of {context_window}"
fg = "text_fg"
states = [
  { gte = 75, bg = "alert", fg = "dark" },
  { gte = 50, bg = "warn", fg = "dark" },
  { gte = 0, bg = "ok", fg = "dark" },
]

[[statusbar.segments]]
type = "git"
template = " {branch}{counts}"
count_style = "symbol"
count_separator = " "
fg = "text_fg"
bg = "git_bg"

[[statusbar.segments]]
type = "status"
key = "llama"
template = " {text} "
fg = "text_fg"
states = [
  { name = "high_cache", match = "cache (5|6|7|8|9)|cache 100", bg = "ok", fg = "dark" },
  { name = "mid_cache", match = "cache (2|3|4)", bg = "warn", fg = "dark" },
  { name = "low_cache", match = "cache (0|1)|cache --", bg = "alert", fg = "dark" },
  { name = "default", bg = "dir_bg", fg = "cyan" },
]

[[statusbar.segments]]
type = "status"
key = "mcp"
template = " {text} "
fg = "text_fg"
states = [
  { name = "all_connected", match = "\\d+/\\d+ server", bg = "ok", fg = "dark" },
  { name = "none_connected", match = "0/\\d+ server", bg = "alert", fg = "dark" },
  { name = "partial", match = "\\d+/\\d+ server", bg = "warn", fg = "dark" },
  { name = "default", template = "  {text} ", bg = "dir_bg", fg = "cyan" },
]

[[statusbar.segments]]
type = "status"
key = "*"
template = " {text} "
fg = "text_fg"
states = [{ name = "default", bg = "dir_bg", fg = "cyan" }]
