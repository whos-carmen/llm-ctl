# pi-bar config - isotope theme (base16-isotope, Plasma/Konsole port)
# Neon text on dark surfaces for readability (solid neon chips were hard to
# read). Parser notes: status states require name+bg, literal [ ] in strings
# misparse, and trailing # comments on value lines are NOT stripped.

[colors]
text_fg = "#d0d0d0"
dir_bg = "#101010"
model_bg = "#1a1a1a"
thinking_bg = "#1a1a1a"
git_bg = "#101010"
activity_bg = "#1a1a1a"
activity_fg = "#00ffff"
ok = "#33ff00"
warn = "#ff0099"
alert = "#ff0000"
cyan = "#00ffff"

[statusbar.separators]
leading = ""
trailing = ""

[[statusbar.segments]]
type = "dir"
template = " {dir}"
fg = "text_fg"
bg = "dir_bg"

[[statusbar.segments]]
type = "value"
template = " {provider}:{model}"
empty_text = "no model"
fg = "cyan"
bg = "model_bg"

[[statusbar.segments]]
type = "value"
template = "{thinking}"
show_if = "model?.reasoning"
fg = "text_fg"
bg = "thinking_bg"

[[statusbar.segments]]
type = "git"
template = " {branch}{counts}"
count_style = "symbol"
count_separator = " "
fg = "text_fg"
bg = "git_bg"

[[statusbar.segments]]
type = "status"
key = "llama"
template = " {text} "
fg = "text_fg"
bg = "dir_bg"
states = [
  { name = "high_cache", match = "cache (5|6|7|8|9)|cache 100", bg = "dir_bg", fg = "ok" },
  { name = "mid_cache", match = "cache (2|3|4)", bg = "dir_bg", fg = "warn" },
  { name = "low_cache", match = "cache (0|1)|cache --", bg = "dir_bg", fg = "alert" },
  { name = "default", bg = "dir_bg", fg = "cyan" },
]

[[statusbar.segments]]
type = "status"
key = "mcp"
template = " {text} "
fg = "text_fg"
bg = "dir_bg"
states = [
  { name = "all_connected", match = "\\d+/\\d+ server", bg = "dir_bg", fg = "ok" },
  { name = "none_connected", match = "0/\\d+ server", bg = "dir_bg", fg = "alert" },
  { name = "partial", match = "\\d+/\\d+ server", bg = "dir_bg", fg = "warn" },
  { name = "default", template = "  {text} ", bg = "dir_bg", fg = "warn" },
]

[[statusbar.segments]]
type = "status"
key = "*"
template = " {text} "
fg = "text_fg"
bg = "dir_bg"
states = [{ name = "default", bg = "dir_bg", fg = "cyan" }]
